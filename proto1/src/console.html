<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>C7S-Loader console mockup</title>
<style>
@font-face { font-family: Noto; src: url(../../assets/fonts/NotoSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: Noto; src: url(../../assets/fonts/NotoSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Plex; src: url(../../assets/fonts/IBMPlexMono-Medium.ttf); }

:root {
  --bg: #0b1220; --panel: #121a2b; --panel2: #19233a; --panel3: #212d48;
  --line: #26324d; --line2: #33415f;
  --text: #e8edf5; --muted: #8e9ab3; --dim: #5d6a86;
  --accent: #2f8cff; --accent-bg: #173462;
  --gold: #d9b65e; --ok: #3ccf91; --warn: #ffc440; --err: #ff6b6b; --red: #e32636;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: Noto; color: var(--text); position: relative; }
.mono { font-family: Plex; }
.b { font-weight: 600; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.top { position: absolute; left: 0; top: 0; width: 1920px; height: 112px; display: flex; align-items: center; padding: 0 36px; border-bottom: 1.5px solid var(--line); background: var(--bg); }
.wordmark { font-family: Plex; font-size: 46px; letter-spacing: -1px; width: 420px; }
.wordmark span { color: var(--gold); }
.tabs { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; }
.tab { font-size: 32px; font-weight: 600; color: var(--muted); padding: 14px 34px; border-radius: 999px; display: flex; align-items: center; gap: 14px; }
.tab.on { color: var(--text); background: var(--panel3); box-shadow: inset 0 0 0 2px var(--line2); }
.tab .ico { width: 30px; height: 30px; }
.status { width: 420px; display: flex; justify-content: flex-end; gap: 12px; }
.chip { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 20px; border-radius: 24px; background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 24px; font-weight: 600; white-space: nowrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 5px rgba(60,207,145,.18); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 5px rgba(255,196,64,.18); }
.dot.err { background: var(--err); box-shadow: 0 0 0 5px rgba(255,107,107,.18); }
.dot.rec { background: var(--red); box-shadow: 0 0 0 5px rgba(227,38,54,.25); }
.chip.rec { background: rgba(227,38,54,.16); box-shadow: inset 0 0 0 1.5px rgba(227,38,54,.6); color: #ffb3ba; }

/* ---------- button glyphs ---------- */
.g { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #e8edf5; color: #0b1220; font-weight: 600; font-size: 27px; flex: none; }
.g.sm { width: 38px; height: 38px; font-size: 22px; }
.g.pill { width: auto; min-width: 58px; padding: 0 12px; border-radius: 12px; height: 38px; font-size: 22px; }
.g.dark { background: rgba(11,18,32,.25); color: #fff; }

/* ---------- footer ---------- */
.foot { position: absolute; left: 0; bottom: 0; width: 1920px; height: 92px; border-top: 1.5px solid var(--line); background: var(--panel); display: flex; align-items: center; padding: 0 36px; font-size: 28px; color: var(--muted); }
.foot .left { flex: 1; display: flex; align-items: center; gap: 14px; }
.foot .hints { display: flex; gap: 40px; }
.hint { display: flex; align-items: center; gap: 14px; color: var(--text); }

/* ---------- generic ---------- */
.main { position: absolute; left: 36px; top: 136px; width: 1848px; height: 828px; }
.panel { background: var(--panel); border-radius: 20px; box-shadow: inset 0 0 0 1.5px var(--line); position: absolute; }
.label { font-size: 24px; font-weight: 600; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; }
.btn { display: flex; align-items: center; justify-content: center; gap: 16px; border-radius: 16px; font-size: 32px; font-weight: 600; background: var(--panel3); box-shadow: inset 0 0 0 2px var(--line2); }
.btn.primary { background: var(--accent); box-shadow: 0 10px 30px rgba(47,140,255,.35); color: #fff; }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 3px var(--red); color: #ff9aa4; }
.btn.focus { outline: 4px solid #fff; outline-offset: 6px; }
.modechip { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 10px; font-size: 20px; font-weight: 600; letter-spacing: 1.5px; }
.m-text { background: rgba(47,140,255,.16); color: #8fc1ff; }
.m-script { background: rgba(60,207,145,.15); color: #7ee6b8; }
.m-chat { background: rgba(217,182,94,.16); color: #ecd291; }

/* ---------- send tab ---------- */
.list { left: 0; top: 0; width: 1100px; height: 828px; padding: 24px; }
.listhead { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 8px 20px; }
.row { height: 104px; border-radius: 16px; display: flex; align-items: center; padding: 0 26px; gap: 24px; margin-bottom: 12px; background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--line); position: relative; }
.row.sel { background: var(--accent-bg); box-shadow: inset 0 0 0 3px var(--accent); }
.row .fi { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.row .nm { font-size: 32px; font-weight: 600; }
.row .mt { font-size: 23px; color: var(--muted); margin-top: 2px; }
.row .sz { margin-left: auto; font-size: 23px; color: var(--muted); }
.detail { left: 1124px; top: 0; width: 724px; height: 828px; padding: 32px; }
.dtitle { font-size: 40px; font-weight: 600; margin: 14px 0 6px; line-height: 1.15; word-break: break-all; }
.facts { display: flex; gap: 28px; font-size: 25px; color: var(--muted); margin-top: 18px; }
.facts b { color: var(--text); font-weight: 600; }
.preview { margin-top: 28px; background: #0a101c; border-radius: 14px; box-shadow: inset 0 0 0 1.5px var(--line); padding: 18px 20px; font-family: Plex; font-size: 21px; line-height: 1.6; color: #b9c5d9; height: 250px; overflow: hidden; white-space: pre; }
.preview .ln { color: var(--dim); display: inline-block; width: 42px; }
.sendbtn { position: absolute; left: 32px; right: 32px; bottom: 32px; height: 124px; font-size: 42px; border-radius: 20px; }
.explain { position: absolute; left: 32px; right: 32px; bottom: 176px; font-size: 24px; color: var(--muted); line-height: 1.45; }

/* ---------- overlay ---------- */
.dim { position: absolute; inset: 0; background: rgba(4,8,16,.78); }
.card { position: absolute; background: var(--panel); border-radius: 28px; box-shadow: inset 0 0 0 1.5px var(--line2), 0 40px 120px rgba(0,0,0,.6); }
.ring { width: 300px; height: 300px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
.ring .num { font-size: 170px; font-weight: 600; line-height: 1; }

/* ---------- live tab ---------- */
.toolbar { position: absolute; left: 0; top: 0; width: 1848px; height: 88px; display: flex; align-items: center; gap: 16px; }
.seg { display: flex; background: var(--panel2); border-radius: 18px; padding: 6px; box-shadow: inset 0 0 0 1.5px var(--line); }
.seg div { height: 72px; padding: 0 30px; display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; color: var(--muted); border-radius: 13px; }
.seg div.on { background: var(--panel3); color: var(--text); box-shadow: inset 0 0 0 2px var(--line2); }
.tb { height: 84px; padding: 0 28px; display: flex; align-items: center; gap: 16px; border-radius: 18px; font-size: 27px; font-weight: 600; background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--line); }
.switch { width: 74px; height: 42px; border-radius: 21px; background: var(--line2); position: relative; }
.switch::after { content: ""; position: absolute; left: 5px; top: 5px; width: 32px; height: 32px; border-radius: 50%; background: #c7d0e0; }
.switch.on { background: var(--ok); }
.switch.on::after { left: 37px; background: #fff; }
.tb.recon { background: rgba(227,38,54,.18); box-shadow: inset 0 0 0 2.5px var(--red); color: #ffc2c8; }
.echo { position: absolute; left: 0; top: 108px; width: 1848px; height: 84px; border-radius: 16px; background: #0a101c; box-shadow: inset 0 0 0 1.5px var(--line); display: flex; align-items: center; padding: 0 26px; gap: 20px; }
.echo .txt { font-family: Plex; font-size: 32px; color: var(--text); }
.caret { display: inline-block; width: 3px; height: 36px; background: var(--accent); vertical-align: -6px; margin-left: 2px; }
.kbd { position: absolute; left: 0; top: 212px; width: 1848px; }
.krow { display: flex; gap: 10px; margin-bottom: 10px; }
.k { height: 112px; border-radius: 14px; background: var(--panel2); box-shadow: inset 0 0 0 1.5px var(--line), 0 5px 0 #0a101c; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 600; position: relative; }
.k.fn { font-size: 26px; color: #c3cde0; background: #162036; }
.k.on { background: var(--accent-bg); box-shadow: inset 0 0 0 3px var(--accent); color: #fff; }
.k.down { background: var(--accent); color: #fff; box-shadow: none; transform: translateY(4px); }
.k .sub { position: absolute; left: 14px; top: 8px; font-size: 20px; color: var(--dim); font-weight: 400; }

.banner { position: absolute; left: 0; top: 112px; width: 1920px; height: 72px; background: linear-gradient(90deg, rgba(217,182,94,.28), rgba(217,182,94,.12)); border-bottom: 1.5px solid rgba(217,182,94,.55); display: flex; align-items: center; gap: 20px; padding: 0 36px; font-size: 27px; color: #f3dfa4; }
.banner b { color: #fff; }

/* gamepad */
.pad { position: absolute; left: 0; top: 108px; width: 1848px; height: 720px; }
.pb { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 600; background: var(--panel2); box-shadow: inset 0 0 0 2px var(--line2), 0 6px 0 #0a101c; color: var(--text); }
.pb.round { border-radius: 50%; }
.pb.on { background: var(--accent); color: #fff; box-shadow: 0 0 0 8px rgba(47,140,255,.25); }
.stick { position: absolute; border-radius: 50%; background: radial-gradient(circle, #1d2840 0, #141c2f 70%); box-shadow: inset 0 0 0 2px var(--line2); }
.stick .nub { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: var(--panel3); box-shadow: inset 0 0 0 3px #4a5a7c, 0 8px 20px rgba(0,0,0,.4); }
.cap { position: absolute; font-size: 22px; color: var(--muted); font-weight: 600; letter-spacing: 2px; text-align: center; }

/* connect */
.qr { width: 380px; height: 380px; background: #fff; border-radius: 20px; padding: 22px; }
.kv { display: flex; justify-content: space-between; align-items: center; height: 78px; border-bottom: 1.5px solid var(--line); font-size: 28px; }
.kv:last-child { border-bottom: 0; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = new URLSearchParams(location.search);
const S = P.get("s") || "send";
const app = document.getElementById("app");
const h = (html) => app.insertAdjacentHTML("beforeend", html);

const IC = {
  send: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M12 5l7 7-7 7"/></svg>',
  live: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h1M8 14h8"/></svg>',
  connect: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg>',
  text: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8fc1ff" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M12 6v13M8 19h8"/></svg>',
  script: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7ee6b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 3 12l5 7M16 5l5 7-5 7"/></svg>',
  chat: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ecd291" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};
const MODE = {
  text:   { chip: '<span class="modechip m-text">TEXT</span>', bg: 'rgba(47,140,255,.14)', name: "Text", desc: "Types each line, then presses Enter." },
  script: { chip: '<span class="modechip m-script">SCRIPT</span>', bg: 'rgba(60,207,145,.13)', name: "Script", desc: "Replays timed key and button presses." },
  chat:   { chip: '<span class="modechip m-chat">CIV 7 CHAT</span>', bg: 'rgba(217,182,94,.14)', name: "Civ 7 chat", desc: "Opens chat with the gamepad, types each line, sends it." },
};
const FILES = [
  { n: "CIV7-RemoteJSLoader.C7S", m: "chat", t: "CIV7 Remote JS Loader", l: 87, s: "38.2 KB" },
  { n: "CIV7-Reach-Chat-Input.C7S", m: "script", t: "CIV7 Reach Chat Input", l: 63, s: "1.1 KB" },
  { n: "Recorded-2026-11-06-0942.C7S", m: "script", t: "Recorded 09:42", l: 148, s: "2.4 KB" },
  { n: "Greeting.C7S", m: "text", t: "Greeting", l: 3, s: "96 B" },
  { n: "SmileBASIC-Hello.C7S", m: "text", t: "SmileBASIC Hello", l: 12, s: "312 B" },
];

const usbWaiting = S === "empty";
const recording = S === "gamepad";
const carry = S === "gamepad";

function topbar(active) {
  const tab = (id, label) => `<div class="tab ${active === id ? "on" : ""}">${IC[id]}${label}</div>`;
  h(`<div class="top">
    <div class="wordmark">C7S<span>-Loader</span></div>
    <div class="tabs"><span class="g pill">L</span>${tab("send", "Send")}${tab("live", "Live")}${tab("connect", "Connect")}<span class="g pill">R</span></div>
    <div class="status">
      ${recording ? '<div class="chip rec"><span class="dot rec"></span>REC 0:12</div>' : ""}
      ${usbWaiting ? '<div class="chip"><span class="dot warn"></span>Plug in USB</div>' : '<div class="chip"><span class="dot"></span>Switch 2 linked</div>'}
    </div>
  </div>`);
}
function foot(hints, left) {
  const hs = hints.map(([g, t]) => `<div class="hint">${g.length > 1 ? `<span class="g pill">${g}</span>` : `<span class="g sm">${g}</span>`}${t}</div>`).join("");
  h(`<div class="foot"><div class="left">${left || '<span class="g pill">+</span> Hold to exit'}</div><div class="hints">${hs}</div></div>`);
}

function sendTab(selIdx) {
  const files = usbWaiting ? [] : FILES;
  let rows = files.map((f, i) => `<div class="row ${i === selIdx ? "sel" : ""}">
      <div class="fi" style="background:${MODE[f.m].bg}">${IC[f.m]}</div>
      <div><div class="nm">${f.n}</div><div class="mt">${f.t} · ${f.l} lines</div></div>
      <div class="sz">${MODE[f.m].chip}</div>
    </div>`).join("");
  if (!files.length) rows = `<div style="height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#5d6a86" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9 13h6M9 16.5h4"/></svg>
      <div style="font-size:40px;font-weight:600">No scripts yet</div>
      <div class="muted" style="font-size:28px;line-height:1.5">Upload a .C7S from the web app, or record one<br>from the <b style="color:var(--text)">Live</b> tab.</div>
      <div class="mono" style="font-size:34px;color:var(--accent);margin-top:10px">http://192.168.1.42:6969</div>
    </div>`;
  h(`<div class="main">
    <div class="panel list">
      <div class="listhead"><div class="label">Scripts on SD card</div><div class="muted" style="font-size:24px">${files.length} files</div></div>
      ${rows}
    </div>
    <div class="panel detail" id="detail"></div>
  </div>`);
  const d = document.getElementById("detail");
  if (!files.length) {
    d.innerHTML = `<div class="label">Before you send</div>
      <div style="margin-top:30px;display:flex;flex-direction:column;gap:30px;font-size:28px;line-height:1.4">
        ${[["1", "Plug the USB cable from this Switch into the Switch 2 dock or USB-C port.", "warn"], ["2", "Wait for the top-right badge to say <b>Switch 2 linked</b>.", ""], ["3", "Pick a script, press <b>A</b>, then focus the text field on the Switch 2.", ""]]
          .map(([n, t, c]) => `<div style="display:flex;gap:22px"><div style="flex:none;width:52px;height:52px;border-radius:50%;background:${c ? "rgba(255,196,64,.18)" : "var(--panel3)"};color:${c ? "var(--warn)" : "var(--text)"};display:flex;align-items:center;justify-content:center;font-weight:600">${n}</div><div style="padding-top:6px">${t}</div></div>`).join("")}
      </div>
      <div style="position:absolute;left:32px;right:32px;bottom:32px;border-radius:16px;padding:22px 24px;background:rgba(255,196,64,.10);box-shadow:inset 0 0 0 1.5px rgba(255,196,64,.45)">
        <div class="b warn" style="font-size:27px">Waiting for the Switch 2</div>
        <div class="muted" style="font-size:23px;margin-top:6px">Gamepad: waiting · Keyboard: waiting</div>
      </div>`;
    return;
  }
  const f = files[selIdx];
  const pv = f.m === "chat"
    ? ['1/87"&gt;&lt;/div&gt;&lt;img src=x onerror="p=window.p||[],p[0]=`func', '2/87"&gt;&lt;/div&gt;&lt;img src=x onerror="p=window.p||[],p[1]=`i%5D', '3/87"&gt;&lt;/div&gt;&lt;img src=x onerror="p=window.p||[],p[2]=`P.ch', '4/87"&gt;&lt;/div&gt;&lt;img src=x onerror="p=window.p||[],p[3]=`%7D%', '5/87"&gt;&lt;/div&gt;&lt;img src=x onerror="p=window.p||[],p[4]=`A%3D']
    : f.m === "script" ? ["@wait 0", "@key 0 0", "@pad 0 8 128 128 128 128", "@wait 724", "@pad 4 8 127 127 127 127", "@wait 264", "@pad 0 8 127 127 127 127"]
    : ["Hello from the Switch 1!", "This line is typed, then Enter.", "Third line."];
  d.innerHTML = `<div class="label">Selected</div>
    <div class="dtitle">${f.n}</div>
    <div style="margin-top:10px">${MODE[f.m].chip}</div>
    <div class="facts"><div><b>${f.l}</b> lines</div><div><b>${f.s}</b></div><div>“${f.t}”</div></div>
    <div class="preview">${pv.map((l, i) => `<span class="ln">${i + 1}</span>${l}`).join("\n")}</div>
    <div class="explain">${MODE[f.m].desc} A 5-second countdown gives you time to focus the target field on the Switch 2.</div>
    <div class="btn primary sendbtn"><span class="g dark">A</span>Send to Switch 2</div>`;
}

function liveToolbar(view) {
  h(`<div class="toolbar">
      <div class="seg"><div class="${view === "kbd" ? "on" : ""}"><span class="g pill" style="height:34px;min-width:52px;font-size:20px">ZL</span>Keyboard</div><div class="${view === "pad" ? "on" : ""}">Gamepad<span class="g pill" style="height:34px;min-width:52px;font-size:20px">ZR</span></div></div>
      <div style="flex:1"></div>
      <div class="tb"><div class="switch ${carry ? "on" : ""}"></div>Pass through Joy-Con</div>
      <div class="tb ${recording ? "recon" : ""}"><span class="dot rec" style="${recording ? "" : "box-shadow:none"}"></span>${recording ? "Stop recording · 0:12" : "Record"}</div>
      <div class="tb">Release all</div>
    </div>`);
}

function keyboard(shift) {
  const U = (1848 - 14 * 10) / 15;
  const k = (label, w = 1, cls = "", sub = "") => `<div class="k ${cls}" style="width:${w * U + (w - 1) * 10}px">${sub ? `<span class="sub">${sub}</span>` : ""}${label}</div>`;
  const nums = "1234567890".split(""), shn = "!@#$%^&*()".split("");
  const r1 = [k(shift ? "~" : "`")].concat(nums.map((n, i) => k(shift ? shn[i] : n, 1, "", shift ? "" : shn[i]))).concat([k(shift ? "_" : "-"), k(shift ? "+" : "="), k("⌫ Backspace", 2, "fn")]);
  const L = (s) => s.split("").map((c) => k(shift ? c.toUpperCase() : c, 1, c === "h" && shift ? "down" : ""));
  const r2 = [k("Tab", 1.5, "fn")].concat(L("qwertyuiop"), [k(shift ? "{" : "["), k(shift ? "}" : "]"), k(shift ? "|" : "\\", 1.5)]);
  const r3 = [k("Esc", 1.75, "fn")].concat(L("asdfghjkl"), [k(shift ? ":" : ";"), k(shift ? '"' : "'"), k("Enter ↵", 2.25, "fn")]);
  const r4 = [k("⇧ Shift", 2.25, "fn " + (shift ? "on" : ""))].concat(L("zxcvbnm"), [k(shift ? "&lt;" : ","), k(shift ? "&gt;" : "."), k(shift ? "?" : "/"), k("⇧ Shift", 2.75, "fn " + (shift ? "on" : ""))]);
  const r5 = [k("Ctrl", 1.5, "fn"), k("Alt", 1.5, "fn"), k("Space", 8, "fn"), k("←", 1, "fn"), k("↑", 1, "fn"), k("↓", 1, "fn"), k("→", 1, "fn")];
  h(`<div class="kbd">${[r1, r2, r3, r4, r5].map((r) => `<div class="krow">${r.join("")}</div>`).join("")}</div>`);
}

function gamepad() {
  const b = (x, y, w, hh, label, cls = "", fs = 40) => `<div class="pb ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;font-size:${fs}px;border-radius:${cls.includes("round") ? "50%" : "18px"}">${label}</div>`;
  const stick = (x, y, d, cap, capx, capy) => `<div class="stick" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"><div class="nub" style="left:${(d - 120) / 2}px;top:${(d - 120) / 2}px"></div></div><div class="cap" style="left:${capx}px;top:${capy}px;width:${d}px">${cap}</div>`;
  const cx = 924;
  h(`<div class="pad">
    <div class="panel" style="left:0;top:0;width:1848px;height:650px"></div>
    ${b(36, 30, 200, 72, "ZL", "", 30)}${b(252, 30, 200, 72, "L", "", 30)}
    ${b(1396, 30, 200, 72, "R", "", 30)}${b(1612, 30, 200, 72, "ZR", "on", 30)}
    ${stick(170, 134, 240, "LEFT STICK", 170, 384)}
    ${b(250, 424, 80, 72, "▲", "", 30)}${b(166, 496, 80, 72, "◀", "", 30)}${b(334, 496, 80, 72, "▶", "", 30)}${b(250, 568, 80, 72, "▼", "", 30)}
    ${b(cx - 260, 150, 96, 96, "−", "round", 50)}${b(cx + 164, 150, 96, 96, "+", "round", 50)}
    ${b(cx - 150, 300, 124, 124, "⌂", "round", 54)}${b(cx + 26, 300, 124, 124, "●", "", 40)}
    <div class="cap" style="left:${cx - 170}px;top:436px;width:164px">HOME</div><div class="cap" style="left:${cx + 6}px;top:436px;width:164px">CAPTURE</div>
    <div class="cap" style="left:${cx - 330}px;top:520px;width:660px;color:var(--dim);letter-spacing:0;font-weight:400;font-size:24px;line-height:1.5">Hold a button to keep it pressed.<br>Drag a stick to tilt it · double-tap it to click (L3 / R3).</div>
    ${b(1560, 130, 116, 116, "X", "round", 48)}${b(1436, 244, 116, 116, "Y", "round", 48)}${b(1684, 244, 116, 116, "A", "round on", 48)}${b(1560, 358, 116, 116, "B", "round", 48)}
    ${stick(1196, 370, 240, "RIGHT STICK", 1196, 620 - 6)}
  </div>`);
}

/* ---------------- screens ---------------- */

if (S === "countdown") {
  topbar("send"); sendTab(0); foot([["A", "Send"]]);
  h(`<div class="dim"></div>

  h(`<div class="dim"></div>
  <div class="card" style="left:360px;top:200px;width:1200px;height:660px">
    <div style="padding:52px 60px">

  keyboard(S === "liveshift");
  h(`<div class="echo"><span class="label" style="font-size:20px">Sent</span><span class="txt">Hello Switch 2! gg wp<span class="caret"></span></span><div style="flex:1"></div><span class="muted" style="font-size:22px">Quick keys</span>
     <div class="tb" style="height:58px;font-size:22px;padding:0 18px">Alt+Enter</div><div class="tb" style="height:58px;font-size:22px;padding:0 18px">Alt+Esc</div><div class="tb" style="height:58px;font-size:22px;padding:0 18px">Alt+⌫</div></div>`);
  // move toolbar/echo/kbd into main
  for (const sel of [".toolbar", ".echo", ".kbd"]) main.appendChild(document.querySelector(sel));

if (S === "gamepad") {
  topbar("live");
  h(`<div class="banner"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f3dfa4" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg><b>Joy-Con pass-through is on.</b> Your controller now plays on the Switch 2 — use the touchscreen to control this app.</div>`);
  h('<div class="main" style="top:208px;height:756px"></div>');
  const main = document.querySelector(".main");
  liveToolbar("pad");
  gamepad();
  main.appendChild(document.querySelector(".toolbar"));
  main.appendChild(document.querySelector(".pad"));
  document.querySelector(".pad").style.top = "104px";
  foot([], '<span class="g pill">+</span> Hold 2 s to exit &nbsp;·&nbsp; Buttons are disabled while pass-through is on — use the touchscreen');
}
if (S === "connect") {
  topbar("connect");
  // fake QR (mockup only)
  let cells = "";
  const N = 29, seed = [7, 13, 3, 11];
  const finder = (r, c) => { const inF = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7; for (const [r0, c0] of [[0, 0], [0, N - 7], [N - 7, 0]]) if (inF(r0, c0)) { const rr = r - r0, cc = c - c0; return rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) ? 1 : 0; } return -1; };
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { let v = finder(r, c); if (v < 0) v = ((r * 31 + c * 17 + r * c * 7 + seed[(r + c) % 4]) % 5) < 2 ? 1 : 0; if (v) cells += `<rect x="${c}" y="${r}" width="1.02" height="1.02"/>`; }
  h(`<div class="main">
    <div class="panel" style="left:0;top:0;width:1100px;height:828px;padding:44px">
      <div class="label">Web app</div>
      <div style="display:flex;gap:48px;margin-top:30px">
        <div class="qr"><svg viewBox="0 0 ${N} ${N}" width="336" height="336" fill="#0b1220">${cells}</svg></div>

      </div>
      <div style="margin-top:44px;font-size:27px;color:var(--muted);line-height:1.6">From the web app you can upload scripts, type text from a real keyboard, and use a controller plugged into your PC.</div>
      <div style="display:flex;gap:20px;margin-top:40px">
        <div class="btn" style="height:88px;padding:0 34px"><span class="g sm">X</span>Change port <span class="muted" style="font-weight:400">· 6969</span></div>

      <div class="kv"><span class="muted">Gamepad</span><span class="ok b">Ready</span></div>
      <div class="kv"><span class="muted">Keyboard</span><span class="ok b">Ready</span></div>
      <div class="kv"><span class="muted">Connection</span><span class="b">Configured</span></div>
      <div class="kv"><span class="muted">Failed reports</span><span class="b">0</span></div>
      <div class="btn" style="position:absolute;left:44px;right:44px;bottom:44px;height:96px"><span class="g sm">Y</span>Test keyboard <span class="muted" style="font-weight:400">· types “hello”</span></div>
    </div>
  </div>`);
  foot([["X", "Port"], ["Y", "Test keyboard"]]);
}
